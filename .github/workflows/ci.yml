name: CI

# Verification pipeline. Runs on every push to every branch so problems are
# caught before code is merged or auto-deployed. Check-runs attach to the commit
# SHA, so these satisfy branch-protection "required status checks" on PRs too.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ios: ${{ steps.filter.outputs.ios }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            ios:
              - 'apps/ios/**'
              - '.swiftlint.yml'
            root:
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.js'
              - '.prettierrc.json'
              - '.prettierignore'
              - '.nvmrc'
              - '.dockerignore'
              - 'docker-compose.yml'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'playwright.config.cjs'
              - 'playwright.offline.config.cjs'

  api:
    name: API · lint · test · smoke
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EXERLY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npx eslint apps/api
      - name: Format check (prettier)
        run: npx prettier --check "apps/api/**/*.{js,json}"
      - name: Tests on PostgreSQL (node:test)
        run: npm test -w apps/api
      - name: API boot smoke test (PostgreSQL, no external services)
        run: bash scripts/smoke-api.sh
        env:
          SMOKE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          JWT_SECRET: ci-smoke-secret
          PORT: '3001'
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t exerly-api:ci .
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
        env:
          JWT_SECRET: ci-only
          POSTGRES_PASSWORD: ci-only

  exerlycore:
    name: ExerlyCore · swift test
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' || needs.changes.outputs.root == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Unit tests
        run: swift test --package-path apps/ios/ExerlyCore

  swiftlint:
    name: iOS · swiftlint (lint-only)
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint (official Docker image)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/realm/swiftlint:latest \
            swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  ios-tests:
    name: iOS build and tests
    runs-on: macos-15
    # The full UI suite takes hours on one runner; it runs locally, sharded,
    # before each landing. CI runs the unit tests and the tap-budget checks.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install fixture API dependencies
        run: npm ci
      # The fixture API runs on a throwaway PostgreSQL cluster (tests/helpers/cluster.js).
      - name: Install PostgreSQL for the fixture API
        run: brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Verify release SDK
        run: bash scripts/ios.sh release-check
      - name: Build iOS
        run: bash scripts/ios.sh build
      - name: Unit tests and tap budgets
        run: >-
          bash scripts/ios.sh test -resultBundlePath artifacts/ios-tests.xcresult
          -only-testing:ExerlyTests -only-testing:ExerlyUITests/TodayUITests
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tests
          path: artifacts/
          retention-days: 14

  lint-workflows:
    name: Lint workflow YAML (actionlint)
    needs: changes
    if: ${{ needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color
