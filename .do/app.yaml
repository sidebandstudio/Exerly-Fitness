name: exerly-api
services:
  - name: api
    source_dir: /
    dockerfile_path: apps/api/Dockerfile
    github:
      repo: sidebandstudio/Exerly-Fitness
      branch: main
      deploy_on_push: true
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /api/health
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      # Client addresses for rate limits come from do-connecting-ip, which
      # App Platform sets; X-Forwarded-For names its ingress. Never set this
      # anywhere else, or clients could choose their own address.
      - key: EXERLY_APP_PLATFORM
        scope: RUN_TIME
        value: '1'
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_EMAILS
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: FATSECRET_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: FATSECRET_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
