name: exerly-api
services:
  - name: api
    source_dir: /
    dockerfile_path: apps/api/Dockerfile
    github:
      repo: sidebandstudio/Exerly-Fitness
      branch: main
      deploy_on_push: true
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /api/health
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      # Off until verified. On App Platform, X-Forwarded-For names
      # DigitalOcean's ingress, so every client shares one rate-limit address.
      # Setting EXERLY_APP_PLATFORM to 1 makes limits read the client from
      # do-connecting-ip instead, but DigitalOcean doesn't document that it
      # replaces a value the client sent, and trusting a forged one would let
      # an attacker rotate addresses past the per-network limits. Before
      # enabling it: send a request with a forged do-connecting-ip through the
      # live app and confirm the server sees the real address. See
      # DECISIONS.md, 2026-10-20. Never set it on a self-hosted server.
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_EMAILS
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: FATSECRET_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: FATSECRET_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
